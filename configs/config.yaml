llm:
  provider: "openai-compatible"
  base_url: "https://api.deepseek.com/v1"
  api_key_env: "LLM_API_KEY"
  default_model: "deepseek-chat"
  temperature: 0.4
  max_tokens: 4000

evaluator_llm:
  provider: "openai-compatible"
  base_url: "https://api.deepseek.com/v1"
  api_key_env: "EVALUATOR_API_KEY"
  model: "deepseek-reasoner"
  temperature: 0.0
  max_tokens: 4000

experiment:
  repetitions: 1
  output_dir: "results"