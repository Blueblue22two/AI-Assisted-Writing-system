llm:
  provider: "openai-compatible"
  base_url: "https://api.vveai.com/v1"
  api_key_env: "LLM_API_KEY"
  default_model: "deepseek-v4-flash"
  temperature: 0.4
  max_tokens: 1600
  api_call_delay: 0.6

evaluator_llm:
  provider: "openai-compatible"
  base_url: "https://api.vveai.com/v1"
  api_key_env: "EVALUATOR_API_KEY"
  model: "gpt-5.2"
  temperature: 0.0
  max_tokens: 2000
  api_call_delay: 0.6

experiment:
  repetitions: 3
  output_dir: "results"
